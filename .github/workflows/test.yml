name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: src
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npx tsx scripts/validate-resume-data.mjs

      # PR-only: deploy to Cloudflare Pages preview, then run a11y
      # and link checks against the live preview URL. Requires
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
      - name: Install Chrome for pa11y
        if: github.event_name == 'pull_request'
        run: npx puppeteer browsers install chrome
      - name: Deploy preview to Cloudflare Pages
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: n-aylward-resume
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: pa11y (homepage + 404)
        if: github.event_name == 'pull_request'
        run: |
          npx pa11y "${{ steps.preview.outputs.url }}/"
          npx pa11y "${{ steps.preview.outputs.url }}/some-missing-page"
      - name: linkinator (internal links)
        if: github.event_name == 'pull_request'
        run: npx linkinator "${{ steps.preview.outputs.url }}/" --recurse
