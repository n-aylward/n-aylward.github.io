name: Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "cleanup-${{ github.event.pull_request.head.ref }}"
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete Cloudflare Pages preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          ids=$(npx -y wrangler@4 pages deployment list \
            --project-name=n-aylward-github-io \
            --environment=preview \
            --json 2>/dev/null \
            | jq -r --arg b "$BRANCH" \
              '.[] | select(.Environment == "Preview" and .Branch == $b) | .Id')
          if [ -z "$ids" ]; then
            echo "No preview deployments for '$BRANCH'."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting $id"
            npx -y wrangler@4 pages deployment delete "$id" \
              --project-name=n-aylward-github-io --force || true
          done
